name: Build CloudStream Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build with Gradle
        run: gradle make --warning-mode all

      # ==========================================
      # 1. GOM FILE .cs3 VÀO THƯ MỤC BUILDS
      # ==========================================
      - name: Prepare builds directory
        run: |
          mkdir -p builds
          echo "=== DANH SÁCH FILE .cs3 TÌM THẤY ==="
          find . -name "*.cs3" -exec cp -v {} builds/ \;
          echo "=== KIỂM TRA THƯ MỤC BUILDS ==="
          ls -la builds/

      # ==========================================
      # 2. TỰ ĐỘNG TẠO REPO.JSON (Thay vì plugins.json)
      # ==========================================
      - name: Generate repo.json
        run: |
          python3 - <<'EOF'
          import json, os, zipfile
          
          plugins = []
          builds_dir = 'builds'
          
          if not os.path.exists(builds_dir) or not os.listdir(builds_dir):
              print("LỖI: Không tìm thấy file .cs3 nào trong thư mục builds!")
              exit(1)
          
          for file in os.listdir(builds_dir):
              if file.endswith('.cs3'):
                  file_path = os.path.join(builds_dir, file)
                  print(f"Đang xử lý: {file}")
                  try:
                      with zipfile.ZipFile(file_path, 'r') as z:
                          if 'manifest.json' in z.namelist():
                              with z.open('manifest.json') as f:
                                  manifest = json.load(f)
                                  plugin_name = manifest.get('name', file.replace('.cs3', ''))
                                  version = manifest.get('version', 1) 
                                  
                                  url = f"https://raw.githubusercontent.com/silentmist3590/noname2/builds/{file}"
                                  
                                  plugins.append({
                                      "name": plugin_name,
                                      "internalName": plugin_name,
                                      "version": version,
                                      "description": f"Plugin {plugin_name}",
                                      "authors": ["Silentmist3590"],
                                      "repositoryUrl": "https://github.com/silentmist3590/noname2",
                                      "url": url,
                                      "iconUrl": "",
                                      "tvTypes": ["Movie", "TvSeries"],
                                      "language": "en"
                                  })
                  except Exception as e:
                      print(f"Lỗi khi đọc file {file}: {e}")
          
          if not plugins:
              print("LỖI: Không thể đọc được manifest.json từ bất kỳ file .cs3 nào!")
              exit(1)
              
          # ⭐ Đổi tên file đầu ra thành repo.json
          with open(os.path.join(builds_dir, 'repo.json'), 'w') as f:
              json.dump(plugins, f, indent=2)
          print(f"THÀNH CÔNG: Đã tạo xong repo.json với {len(plugins)} plugin.")
          EOF

      # ==========================================
      # 3. PUSH LÊN NHÁNH BUILDS
      # ==========================================
      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
