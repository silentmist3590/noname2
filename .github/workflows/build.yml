name: Build

on:
  push:
    branches:
      - main # Hoặc master, tùy vào nhánh chính của bạn
    paths-ignore:
      - '*.md' # Bỏ qua build khi chỉ thay đổi file markdown

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4 # Cập nhật lên v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4 # Cập nhật lên v4
        with:
          ref: "builds" # Nhánh chứa file .cs3, cần được tạo trước
          path: "builds"

      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17 # Cập nhật lên JDK 17
        uses: actions/setup-java@v5 # Cập nhật lên v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4 # Cập nhật lên v4

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
