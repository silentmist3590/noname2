name: Build CloudStream Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # BƯỚC NÀY GIÚP VƯỢT LỖI 504 BẰNG CÁCH TẢI TỪ MIRROR TENCENT
      - name: Cache Gradle distribution from mirror
        run: |
          mkdir -p $HOME/.gradle/wrapper/dists/gradle-8.14-bin
          cd $HOME/.gradle/wrapper/dists/gradle-8.14-bin
          curl -L -o gradle-8.14-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip
          unzip -q gradle-8.14-bin.zip
          touch gradle-8.14-bin.zip.ok
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

       # Bỏ qua gradlew, gọi thẳng lệnh gradle
      - name: Build with Gradle
        run: gradle make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Plugins
          path: |
            **/build/*.cs3
            **/build/outputs/apk/debug/*.apk
