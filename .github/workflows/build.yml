name: Build CloudStream Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build with Gradle
        run: gradle make --warning-mode all

      - name: Prepare builds directory
        run: |
          mkdir -p builds
          find . -name "*.cs3" -exec cp -v {} builds/ \;

      - name: Generate plugin files
        run: |
          python3 - <<'EOF'
          import json, os, zipfile
          
          plugins = []
          builds_dir = 'builds'
          
          for file in os.listdir(builds_dir):
              if file.endswith('.cs3'):
                  file_path = os.path.join(builds_dir, file)
                  try:
                      with zipfile.ZipFile(file_path, 'r') as z:
                          manifest_name = 'manifest.json' if 'manifest.json' in z.namelist() else 'plugin.json'
                          
                          if manifest_name in z.namelist():
                              with z.open(manifest_name) as f:
                                  manifest = json.load(f)
                                  
                                  # Lấy thông tin chính xác từ manifest
                                  plugin_name = manifest.get('name', file.replace('.cs3', ''))
                                  internal_name = manifest.get('internalName', manifest.get('pluginClassName', plugin_name))
                                  version = int(manifest.get('version', 1))
                                  
                                  # Đảm bảo URL chính xác (lưu ý tên repo của bạn là noname2)
                                  url = f"https://raw.githubusercontent.com/silentmist3590/noname2/builds/{file}"
                                  
                                  plugins.append({
                                      "name": plugin_name,
                                      "internalName": internal_name,
                                      "version": version,
                                      "description": manifest.get('description', f"Plugin {plugin_name}"),
                                      "authors": ["Silentmist3590"],
                                      "repositoryUrl": "https://github.com/silentmist3590/noname2",
                                      "url": url,
                                      "iconUrl": "",
                                      "tvTypes": manifest.get('tvTypes', ["Movie", "TvSeries"]),
                                      "language": "en"
                                  })
                  except Exception as e:
                      print(f"Lỗi khi đọc file {file}: {e}")

          with open(os.path.join(builds_dir, 'plugins.json'), 'w') as f:
              json.dump(plugins, f, indent=2)

          repo_data = {
              "name": "Noname CloudStream Repository",
              "description": "Kho plugin phim tiếng Việt tự động",
              "manifestVersion": 1,
              "pluginLists": [
                  "https://raw.githubusercontent.com/silentmist3590/noname2/builds/plugins.json"
              ]
          }

          with open(os.path.join(builds_dir, 'repo.json'), 'w') as f:
              json.dump(repo_data, f, indent=2)
          EOF

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
