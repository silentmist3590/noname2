name: Build CloudStream Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build with Gradle
        run: gradle make --warning-mode all

      - name: Prepare builds directory
        run: |
          mkdir -p builds
          echo "=== COPY FILE .cs3 ==="
          find . -name "*.cs3" -exec cp -v {} builds/ \;
          ls -la builds/

      - name: Generate repo.json
        run: |
          python3 - <<'EOF'
          import json, os, zipfile
          
          plugins = []
          builds_dir = 'builds'
          
          if not os.path.exists(builds_dir) or not os.listdir(builds_dir):
              print("LỖI: Không tìm thấy file .cs3 nào!")
              exit(1)
          
          for file in os.listdir(builds_dir):
              if file.endswith('.cs3'):
                  file_path = os.path.join(builds_dir, file)
                  print(f"Đang xử lý: {file}")
                  try:
                      with zipfile.ZipFile(file_path, 'r') as z:
                          # Cố gắng tìm manifest.json bên trong file .cs3
                          manifest_name = 'manifest.json' if 'manifest.json' in z.namelist() else 'plugin.json'
                          
                          if manifest_name in z.namelist():
                              with z.open(manifest_name) as f:
                                  manifest = json.load(f)
                                  
                                  # Lấy thông tin an toàn
                                  plugin_name = manifest.get('name', file.replace('.cs3', ''))
                                  version = int(manifest.get('version', 1))
                                  
                                  # Đảm bảo authors là một mảng
                                  authors = manifest.get('authors', ["Silentmist3590"])
                                  if isinstance(authors, str): authors = [authors]
                                  
                                  # Đảm bảo tvTypes là mảng
                                  tv_types = manifest.get('tvTypes', ["Movie", "TvSeries"])
                                  if isinstance(tv_types, str): tv_types = [tv_types]

                                  url = f"https://raw.githubusercontent.com/silentmist3590/noname2/builds/{file}"
                                  
                                  plugins.append({
                                      "name": plugin_name,
                                      "internalName": plugin_name,
                                      "version": version,
                                      "description": manifest.get('description', f"Plugin {plugin_name}"),
                                      "authors": authors,
                                      "repositoryUrl": "https://github.com/silentmist3590/noname2",
                                      "url": url,
                                      "iconUrl": manifest.get('iconUrl', ""),
                                      "tvTypes": tv_types,
                                      "language": manifest.get('language', "en")
                                  })
                          else:
                              print(f"CẢNH BÁO: Không tìm thấy manifest.json trong {file}")
                  except Exception as e:
                      print(f"Lỗi khi đọc file {file}: {e}")
          
          with open(os.path.join(builds_dir, 'repo.json'), 'w') as f:
              json.dump(plugins, f, indent=2)
          print(f"THÀNH CÔNG: Đã tạo repo.json với {len(plugins)} plugin.")
          EOF

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
